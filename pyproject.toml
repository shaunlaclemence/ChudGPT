[project]
name = "chudgpt"
version = "0.1.0"
description = "Route chat prompts across free-tier AI providers, rotating API keys transparently when daily limits are hit"
readme = "README.md"
authors = [
    { name = "Shaun Laclemence", email = "131640457+shaunlaclemence@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=2.49.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]
