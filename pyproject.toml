[project]
name = "chudgpt"
version = "0.6.1"
description = "Route chat prompts across free-tier AI providers, rotating API keys transparently when daily limits are hit"
readme = "README.md"
authors = [
    { name = "Shaun Laclemence", email = "131640457+shaunlaclemence@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "filetype>=1.2.0",
    "ollama>=0.6.2",
    "openai>=2.49.0",
    "platformdirs>=4.11.0",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    # zoneinfo has no IANA database on Windows or slim Linux images
    "tzdata>=2026.1",
]

[project.optional-dependencies]
audio = [
    "numpy>=2.4.0",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.0",
    "soundfile>=0.14.0",
]

[tool.pytest.ini_options]
markers = [
    "live: hits a real provider, needs keys and burns quota",
    "audio: needs the audio extra (uv sync --extra audio)",
    "ollama: needs a local ollama server with the model pulled",
]
